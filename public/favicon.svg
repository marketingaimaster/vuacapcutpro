<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft pastel iridescent gradient for PRO pill badge -->
    <linearGradient id="proGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BED0FB" />
      <stop offset="50%" stop-color="#D7CAFD" />
      <stop offset="100%" stop-color="#F2D1F4" />
    </linearGradient>
  </defs>

  <!-- Clean White Rounded Background -->
  <rect width="512" height="512" rx="72" fill="#FFFFFF" />

  <!-- CapCut Primary Logo Mark -->
  <g transform="translate(86, 42) scale(14.05)">
    <path fill="#000000" d="M24.189 6.442V2.671l-4.535 2.383V4.91c.002-1.505-1.078-2.411-2.638-2.411H2.64C.993 2.5 0 3.407 0 4.91V8.72L6.354 12 0 15.316v3.8C0 20.595 1 21.5 2.64 21.5h14.373c1.56 0 2.639-.907 2.639-2.382v-.197l4.536 2.409v-3.828L13.64 12 24.19 6.443zM9.982 13.873l7.797 4.083H2.157l7.825-4.083zm7.741-7.828l-7.742 4.057-7.825-4.057h15.567z" />
  </g>

  <!-- Bottom Brand Row: CapCut text + PRO badge -->
  <!-- Total width ~ 380px, centered horizontally at ~ 66px -->
  <g transform="translate(62, 424)">
    <!-- Wordmark "CapCut" -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="900" fill="#000000" letter-spacing="-1.5">CapCut</text>
    
    <!-- Iridescent PRO Pill Badge -->
    <rect x="246" y="-52" width="144" height="64" rx="20" fill="url(#proGrad)" />
    <!-- "PRO" Bold Text -->
    <text x="318" y="-7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">PRO</text>
  </g>
</svg>
