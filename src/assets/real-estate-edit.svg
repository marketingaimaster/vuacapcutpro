<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </radialGradient>

    <!-- Glow Filter for Blue EDIT -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Glow Filter for Green GỐC -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtitle Glow Filter -->
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Dark Textured Background -->
  <rect width="540" height="960" fill="url(#bgGrad)" />
  <rect width="540" height="960" fill="#ffffff" opacity="0.02" />

  <!-- TOP TITLE: EDIT -->
  <text x="345" y="195" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-weight="900" font-size="38" fill="#38bdf8" text-anchor="middle" filter="url(#blueGlow)" letter-spacing="2">EDIT</text>

  <!-- MAIN FRAME (EDITED REAL ESTATE VIDEO) -->
  <g transform="translate(205, 215)">
    <!-- Metallic Frame Border -->
    <rect x="-6" y="-6" width="282" height="472" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <rect x="0" y="0" width="270" height="460" rx="3" fill="#87ceeb" clip-path="url(#mainClip)" />

    <!-- Clip Path for inner video -->
    <clipPath id="mainClip">
      <rect x="0" y="0" width="270" height="460" rx="3" />
    </clipPath>

    <g clip-path="url(#mainClip)">
      <!-- Apartment Buildings Background -->
      <rect x="0" y="0" width="270" height="230" fill="#cbe3f7" />
      <!-- Building 1 -->
      <rect x="10" y="30" width="90" height="200" fill="#e2e8f0" />
      <rect x="15" y="40" width="12" height="15" fill="#64748b" opacity="0.6" />
      <rect x="35" y="40" width="12" height="15" fill="#64748b" opacity="0.6" />
      <rect x="55" y="40" width="12" height="15" fill="#64748b" opacity="0.6" />
      <rect x="75" y="40" width="12" height="15" fill="#64748b" opacity="0.6" />
      <rect x="15" y="65" width="12" height="15" fill="#64748b" opacity="0.6" />
      <rect x="35" y="65" width="12" height="15" fill="#38bdf8" opacity="0.8" />
      <rect x="55" y="65" width="12" height="15" fill="#64748b" opacity="0.6" />
      <rect x="75" y="65" width="12" height="15" fill="#64748b" opacity="0.6" />

      <!-- Building 2 (Tall Center) -->
      <rect x="105" y="10" width="110" height="220" fill="#f1f5f9" />
      <!-- Windows Grid -->
      <path d="M115,20 h90 M115,35 h90 M115,50 h90 M115,65 h90 M115,80 h90 M115,95 h90 M115,110 h90 M115,125 h90" stroke="#cbd5e1" stroke-width="2" />

      <!-- Green Trees / Landscape -->
      <path d="M 0,220 Q 70,180 140,210 T 270,200 L 270,300 L 0,300 Z" fill="#15803d" />
      <path d="M 30,230 Q 100,190 180,220 T 270,210 L 270,320 L 0,320 Z" fill="#16a34a" />

      <!-- Presenter (Man in Blue Shirt with Glasses) -->
      <!-- Body / Blue Shirt -->
      <path d="M 70,460 L 80,330 Q 135,310 190,330 L 200,460 Z" fill="#1e3a8a" />
      <path d="M 120,330 L 135,380 L 150,330 Z" fill="#fbcfe8" /> <!-- Neck -->
      <path d="M 80,330 L 120,340 L 110,400 L 70,380 Z" fill="#1d4ed8" /> <!-- Left Shoulder -->
      <path d="M 190,330 L 150,340 L 160,400 L 200,380 Z" fill="#1d4ed8" /> <!-- Right Shoulder -->

      <!-- Open Hands Gesture -->
      <path d="M 50,390 Q 60,360 75,370 Q 70,400 55,410 Z" fill="#fbcfe8" />
      <path d="M 220,390 Q 210,360 195,370 Q 200,400 215,410 Z" fill="#fbcfe8" />

      <!-- Head & Hair -->
      <ellipse cx="135" cy="275" rx="28" ry="34" fill="#fbcfe8" />
      <!-- Stylish Hair -->
      <path d="M 105,265 Q 110,230 135,232 Q 165,230 168,265 Q 150,245 135,248 Q 120,245 105,265 Z" fill="#1e1b4b" />
      <!-- Glasses -->
      <rect x="115" y="262" width="16" height="12" rx="2" fill="none" stroke="#0f172a" stroke-width="2.5" />
      <rect x="139" y="262" width="16" height="12" rx="2" fill="none" stroke="#0f172a" stroke-width="2.5" />
      <line x1="131" y1="268" x2="139" y2="268" stroke="#0f172a" stroke-width="2" />
      <!-- Smile -->
      <path d="M 125,292 Q 135,300 145,292" fill="none" stroke="#e11d48" stroke-width="2" />

      <!-- Subtitles on Video -->
      <g filter="url(#textShadow)">
        <text x="135" y="200" font-family="'Arial Black', sans-serif" font-weight="900" font-size="16" fill="#facc15" text-anchor="middle" letter-spacing="1">NHỮNG THỨ HIẾM</text>
        <rect x="35" y="208" width="200" height="24" fill="#000000" opacity="0.6" rx="4" />
        <text x="135" y="225" font-family="'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">LUÔN ĐƯỢC SẮN ĐÓN</text>
      </g>
    </g>
  </g>

  <!-- VERTICAL BRAND TEXT: MANH EDIT -->
  <g transform="translate(182, 330) rotate(-90)">
    <text x="0" y="0" font-family="'Arial Black', sans-serif" font-weight="900" font-size="18" fill="#ffffff" letter-spacing="3" opacity="0.9">MANH EDIT</text>
  </g>

  <!-- LEFT TITLE: GỐC -->
  <text x="110" y="420" font-family="'Arial Black', sans-serif" font-weight="900" font-size="32" fill="#4ade80" text-anchor="middle" filter="url(#greenGlow)" letter-spacing="1">GỐC</text>

  <!-- LEFT FRAME (UNEDITED RAW VIDEO) -->
  <g transform="translate(38, 440)">
    <rect x="-3" y="-3" width="148" height="250" rx="4" fill="#334155" />
    <rect x="0" y="0" width="142" height="244" rx="2" fill="#64748b" clip-path="url(#rawClip)" />

    <clipPath id="rawClip">
      <rect x="0" y="0" width="142" height="244" rx="2" />
    </clipPath>

    <g clip-path="url(#rawClip)" opacity="0.85">
      <!-- Raw Background -->
      <rect x="0" y="0" width="142" height="130" fill="#94a3b8" />
      <rect x="10" y="20" width="50" height="110" fill="#64748b" />
      <rect x="65" y="10" width="65" height="120" fill="#cbd5e1" />
      <path d="M 0,120 Q 70,110 142,125 L 142,160 L 0,160 Z" fill="#15803d" opacity="0.6" />

      <!-- Raw Presenter -->
      <path d="M 35,244 L 42,180 Q 71,165 100,180 L 107,244 Z" fill="#1e3a8a" opacity="0.8" />
      <ellipse cx="71" cy="150" rx="16" ry="19" fill="#fbcfe8" opacity="0.9" />
      <path d="M 55,145 Q 58,125 71,127 Q 87,125 89,145 Z" fill="#1e1b4b" />
      <!-- Glasses -->
      <rect x="60" y="143" width="9" height="7" fill="none" stroke="#0f172a" stroke-width="1.5" />
      <rect x="73" y="143" width="9" height="7" fill="none" stroke="#0f172a" stroke-width="1.5" />
    </g>
  </g>

  <!-- BOTTOM SECTION: CAPCUT TIMELINE INTERFACE -->
  <g transform="translate(38, 725)">
    <!-- Timeline Container Outer -->
    <rect x="0" y="0" width="464" height="190" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Top Toolbar Header -->
    <rect x="0" y="0" width="464" height="28" rx="8" fill="#1e293b" />
    <circle cx="20" cy="14" r="4" fill="#ef4444" />
    <circle cx="34" cy="14" r="4" fill="#eab308" />
    <circle cx="48" cy="14" r="4" fill="#22c55e" />
    <text x="232" y="18" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">CapCut Pro Timeline Editor - 4K 60FPS</text>

    <!-- Time Ruler -->
    <rect x="0" y="28" width="464" height="20" fill="#090d16" />
    <path d="M 10,48 v-10 M 50,48 v-6 M 90,48 v-10 M 130,48 v-6 M 170,48 v-10 M 210,48 v-6 M 250,48 v-10 M 290,48 v-6 M 330,48 v-10 M 370,48 v-6 M 410,48 v-10 M 450,48 v-6" stroke="#475569" stroke-width="1.5" />
    <text x="10" y="36" font-family="monospace" font-size="9" fill="#64748b">00:00</text>
    <text x="90" y="36" font-family="monospace" font-size="9" fill="#64748b">00:05</text>
    <text x="170" y="36" font-family="monospace" font-size="9" fill="#64748b">00:10</text>
    <text x="250" y="36" font-family="monospace" font-size="9" fill="#64748b">00:15</text>
    <text x="330" y="36" font-family="monospace" font-size="9" fill="#64748b">00:20</text>
    <text x="410" y="36" font-family="monospace" font-size="9" fill="#64748b">00:25</text>

    <!-- Track 1: Text Subtitles (Yellow/Orange) -->
    <rect x="15" y="54" width="80" height="18" rx="3" fill="#f59e0b" opacity="0.8" />
    <rect x="100" y="54" width="120" height="18" rx="3" fill="#d97706" opacity="0.9" />
    <rect x="225" y="54" width="110" height="18" rx="3" fill="#f59e0b" opacity="0.8" />
    <rect x="340" y="54" width="95" height="18" rx="3" fill="#d97706" opacity="0.9" />

    <!-- Track 2: Effects / Stickers (Purple/Pink) -->
    <rect x="40" y="76" width="140" height="20" rx="3" fill="#a855f7" opacity="0.85" />
    <rect x="185" y="76" width="75" height="20" rx="3" fill="#ec4899" opacity="0.85" />
    <rect x="265" y="76" width="150" height="20" rx="3" fill="#8b5cf6" opacity="0.85" />

    <!-- Track 3: Video Clips (Main Track - Blue/Teal with Thumbnail Strips) -->
    <rect x="15" y="100" width="150" height="32" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
    <rect x="170" y="100" width="180" height="32" rx="4" fill="#0d9488" stroke="#2dd4bf" stroke-width="1" />
    <rect x="355" y="100" width="95" height="32" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />

    <!-- Video Track Details (Clip separators) -->
    <line x1="65" y1="100" x2="65" y2="132" stroke="#0284c7" stroke-width="2" />
    <line x1="115" y1="100" x2="115" y2="132" stroke="#0284c7" stroke-width="2" />
    <line x1="230" y1="100" x2="230" y2="132" stroke="#0d9488" stroke-width="2" />

    <!-- Track 4: Audio Waveforms (Green) -->
    <rect x="15" y="136" width="435" height="22" rx="3" fill="#15803d" opacity="0.9" />
    <!-- Waveform Lines -->
    <path d="M 20,147 Q 25,138 30,147 T 40,147 T 50,137 T 60,154 T 70,147 T 80,139 T 90,150 T 100,147 T 120,137 T 140,154 T 160,140 T 180,147 T 200,137 T 220,152 T 240,147 T 260,138 T 280,153 T 300,147 T 320,137 T 340,150 T 360,147 T 380,138 T 400,152 T 420,147 T 440,140" stroke="#86efac" stroke-width="1.5" fill="none" />

    <!-- Playhead Red Line -->
    <line x1="195" y1="28" x2="195" y2="185" stroke="#ef4444" stroke-width="2" />
    <polygon points="190,28 200,28 195,36" fill="#ef4444" />
  </g>
</svg>
